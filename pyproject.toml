[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "afib-edge-prediction-capstone"
version = "0.1.0"
description = "Engineering research prototype for short-term AF onset prediction from single-lead ECG."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy",
  "scipy",
  "pandas",
  "scikit-learn",
  "PyYAML",
  "wfdb",
  "torch",
  "onnx",
  "onnxruntime",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
