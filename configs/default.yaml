# PAPER-ALIGNED unless a comment says otherwise.
project:
  name: afib-edge-prediction-capstone
  seed: 2026  # REPRODUCTION CHOICE: paper does not state a seed.

data:
  database: afdb
  raw_dir: data/raw/afdb  # Local only; ignored by Git.
  annotation_extension: atr
  smoke_record: "04015"
  lead_index: 0  # REPRODUCTION CHOICE: paper does not identify the AFDB lead.
  window_stride_seconds: 480  # REPRODUCTION CHOICE: 20% overlap => 80% stride.

signal:
  model_rate_hz: 250
  observation_minutes: 10
  segment_seconds: 30
  segments_per_observation: 20
  samples_per_segment: 7500
  prediction_horizon_minutes: 20
  bandpass_low_hz: 0.5
  bandpass_high_hz: 40.0

hrv:
  features:
    - RMSSD
    - SDNN
    - LF/HF
    - Mean RR
    - pNN50
    - Sample Entropy
  r_peak_detector: wfdb_xqrs  # REPRODUCTION CHOICE: detector is omitted by the paper.
  invalid_value: NaN  # Missingness remains explicit until train-fold imputation is defined.
  lf_hf:
    interpolation_hz: 4.0
    minimum_rr_intervals: 10
    minimum_span_seconds: 20.0
  sample_entropy:
    embedding_dimension: 2
    tolerance_sd_ratio: 0.2
    minimum_rr_intervals: 8

splitting:
  outer_method: GroupKFold
  outer_splits: 5
  validation_group_aware: true

model_contract:
  ecg_shape: [B, 20, 1, 7500]
  hrv_shape: [B, 20, 6]
  max_parameters_exclusive: 250000

training_defaults:
  optimizer: AdamW
  learning_rate: 0.0005
  weight_decay: 0.0001
  batch_size: 32
  dropout: 0.3
  gradient_clip_norm: 1.0
  early_stopping_metric: f1
  early_stopping_patience: 10

notes:
  - "AFDB observation windows are accepted only when the full 10 minutes are explicitly annotated as normal rhythm (N)."
  - "Rhythm annotation times are kept in original-record seconds; ECG resampling does not move labels."
  - "No preprocessing statistic, HRV imputation, or scaler is fitted in this pipeline."
  - "No validation or outer-test patient may influence learned preprocessing later."
